schema_version: "1"
name: tr-virt-019-parallel-vm-lifecycle-smoke
description: >-
  Fast TR-VIRT-019 smoke: 2 VMs, 1 DataVolume per VM, 1 iteration. Verifies the
  full virt-parallel pipeline (create, resize, restart, snapshot, migrate, delete)
  at minimal scale. Use plans/tr-virt-019-parallel-vm-lifecycle.yaml for a
  progressive-scale run.
concurrency: 1
backend: ontap-san
select:
  ids:
    - TR-VIRT-019
overrides:
  TR-VIRT-019:
    workload: virt-parallel
    initial_vms: 2
    increment: 0
    data_volume_count: 1
    max_iterations: 1
    vm_image: quay.io/containerdisks/fedora:41
    skip_migration_job: false
