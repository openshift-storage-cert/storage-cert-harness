schema_version: "1"
name: virtbench-replay
description: >-
  Offline demo of the virtbench datasource-clone integration (TR-VIRT-002) in
  REPLAY mode: instead of exec-ing the virtbench CLI against a live cluster, the
  runner grades a pre-collected results directory. Point `results_dir` at any
  folder containing a virtbench summary_vm_creation_results.json. Here it targets
  the committed parser fixture so the whole pipeline runs with no cluster.
  Requires a thresholds bundle (real numbers live only in the private KB export;
  point --thresholds at that file at run time).
select:
  ids:
    - TR-VIRT-002
overrides:
  TR-VIRT-002:
    results_dir: internal/tools/virtbench/testdata
