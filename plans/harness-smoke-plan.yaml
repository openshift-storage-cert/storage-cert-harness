schema_version: "1"
name: harness-smoke
description: >-
  Focused post-PR-198 verification for the published kube-burner payload:
  Portworx node-condition handling and the full 20-VM lifecycle with migration
  evidence. Set backend to a configured Portworx backend before running.
backend: oc-edge-112
concurrency: 1
select:
  ids:
    - TR-STOR-006  # PVC provisioning density; kube-burner-ocp/node conditions
    - TR-VIRT-019  # Parallel VM lifecycle; kube-burner-ocp/migration evidence
overrides:
  TR-STOR-006:
    workload: pvc-density
    iterations: 3
    claim_size: 256Mi
    qps: 5
    burst: 10
  TR-VIRT-019:
    workload: virt-parallel
    vms: 20
    initial_vms: 20
    increment: 0
    data_volume_count: 1
    max_iterations: 1
    # PR #198 verification requires the migration job and its evidence.
    skip_migration_job: false
    qps: 5
    burst: 10
    timeout: 60m
