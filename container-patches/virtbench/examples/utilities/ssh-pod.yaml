apiVersion: v1
kind: Pod
metadata:
  name: ssh-test-pod
  namespace: default
  labels:
    app: kubevirt-perf-test
    managed-by: storage-cert-harness
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: ssh-client
      image: quay.io/virtarraycert/ssh-helper@sha256:f73550de05f30f6c2c53c7efe24ab1fd5eff0f952bd7aa556aaf7572f9cb4706
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      command: ["/bin/bash", "-c", "exec sleep infinity"]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: home
          mountPath: /home/sshhelper
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "200m"
  volumes:
    - name: tmp
      emptyDir: {}
    - name: home
      emptyDir: {}
  restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: ssh-test-pod
  namespace: default
spec:
  selector:
    app: kubevirt-perf-test
  ports:
    - protocol: TCP
      port: 22
      targetPort: 22
