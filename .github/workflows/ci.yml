name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the image and advance versions after all checks pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  linters:
    uses: ./.github/workflows/ci-linters.yml

  tests:
    needs: [linters]
    uses: ./.github/workflows/ci-tests.yml

  build:
    needs: [tests]
    uses: ./.github/workflows/ci-build.yml

  smoke:
    if: vars.REPLAY_SMOKE_ENABLED == 'true'
    needs: [build]
    uses: ./.github/workflows/ci-smoke.yml

  images:
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.smoke.result == 'success' || needs.smoke.result == 'skipped')
    needs: [build, smoke]
    uses: ./.github/workflows/ci-images.yml

  publish:
    if: >-
      needs.images.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    needs: [images]
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/ci-publish.yml
    with:
      publish: true
    secrets: inherit
