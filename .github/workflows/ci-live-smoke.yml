# Live cluster smoke — disabled until operators set repository variable
# CI_LIVE_SMOKE_ENABLED=true and configure the live-smoke environment.
# See docs/design/storage-cert-harness-ci-smoke-test.md

name: CI Live Smoke

on:
  pull_request:
    types: [opened]
    branches: [main]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch or SHA to smoke (same-repo PR branch)
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  live-smoke-pr-open:
    if: >-
      vars.CI_LIVE_SMOKE_ENABLED == 'true' &&
      github.repository == 'openshift-storage-cert/storage-cert-harness' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.title, '[skip live-smoke]') &&
      !contains(github.event.pull_request.body, '[skip live-smoke]')
    runs-on: [self-hosted, storage-cert-smoke]
    environment: live-smoke
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Run live cluster smoke
        run: |
          set -euo pipefail
          if [[ ! -x ci/scripts/live-cluster-smoke.sh ]]; then
            echo "error: ci/scripts/live-cluster-smoke.sh is not installed yet" >&2
            exit 1
          fi
          ./ci/scripts/live-cluster-smoke.sh

  live-smoke-comment:
    if: >-
      vars.CI_LIVE_SMOKE_ENABLED == 'true' &&
      github.repository == 'openshift-storage-cert/storage-cert-harness' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/run-live-smoke') &&
      contains(fromJSON('["MEMBER","OWNER","COLLABORATOR","MAINTAINER"]'),
        github.event.comment.author_association)
    runs-on: [self-hosted, storage-cert-smoke]
    environment: live-smoke
    timeout-minutes: 240
    steps:
      - uses: actions/github-script@v7
        id: pr-meta
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const canonical = `${context.repo.owner}/${context.repo.repo}`;
            if (pr.data.head.repo.full_name !== canonical) {
              core.setFailed(`fork PR smoke is not allowed (${pr.data.head.repo.full_name})`);
              return;
            }
            const body = pr.data.body || '';
            const title = pr.data.title || '';
            if (title.includes('[skip live-smoke]') || body.includes('[skip live-smoke]')) {
              core.setFailed('PR has [skip live-smoke]');
              return;
            }
            core.setOutput('ref', pr.data.head.sha);
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr-meta.outputs.ref }}
      - name: Run live cluster smoke
        run: |
          set -euo pipefail
          if [[ ! -x ci/scripts/live-cluster-smoke.sh ]]; then
            echo "error: ci/scripts/live-cluster-smoke.sh is not installed yet" >&2
            exit 1
          fi
          ./ci/scripts/live-cluster-smoke.sh

  live-smoke-dispatch:
    if: >-
      vars.CI_LIVE_SMOKE_ENABLED == 'true' &&
      github.repository == 'openshift-storage-cert/storage-cert-harness' &&
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, storage-cert-smoke]
    environment: live-smoke
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref }}
      - name: Run live cluster smoke
        run: |
          set -euo pipefail
          if [[ ! -x ci/scripts/live-cluster-smoke.sh ]]; then
            echo "error: ci/scripts/live-cluster-smoke.sh is not installed yet" >&2
            exit 1
          fi
          ./ci/scripts/live-cluster-smoke.sh
